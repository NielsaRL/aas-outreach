{% extends "outreach/base_public.html" %}

{% block title %}Edit Volunteer Profile{% endblock %}

{% block content %}
<main class="container my-5">

    <section class="mb-4">
        <p class="eyebrow text-muted">Volunteer Portal</p>
        <h1>Edit Volunteer Profile</h1>
        <p class="text-muted">
            Update your contact information and the equipment you usually bring.
        </p>
    </section>

    <section class="auth-card mx-auto">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-aas-gold w-100">
                Save Profile
            </button>

            <a href="{% url 'volunteer_portal' %}" class="btn btn-outline-secondary w-100 mt-2">
                Cancel
            </a>
        </form>
    </section>

</main>
{% endblock %}
