{% extends "outreach/base_public.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<main class="container my-5">
    <div class="auth-card mx-auto">
        <p class="eyebrow text-muted">AAS Outreach</p>

        <h1>Change Your Password</h1>

        <p class="text-muted">
            To change your password, enter your current
            password and choose a new one.
        </p>

        <form method="post" class="mt-4">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-aas-gold w-100">
                Change Password
            </button>
        </form>

        <hr>

        <p class="mb-0">
            <a href="{% url 'volunteer_portal' %}">
                Return to Volunteer Portal
            </a>
        </p>
    </div>
</main>
{% endblock %}
